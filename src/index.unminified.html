      for (let b = 0; b <= n - 11; b++) {

        if (match(k => m[b + k][a], A) || match(k => m[b + k][a], B)) p += 40;
      }
    let dark = 0;
    for (const row of m) for (const v of row) if (v) dark++;
    const total = n * n;
    p += (Math.ceil(Math.abs(dark * 20 - total * 10) / total) - 1) * 10;
    return p;
  }

  function encode(text, ecl = 'M') {
    const bytes = utf8(text);
    let ver = 1;
    for (; ; ver++) {
      if (ver > 40) throw new Error('Text too long for a QR code');
      const ccBits = ver <= 9 ? 8 : 16;
      const used = 4 + ccBits + bytes.length * 8;
      if (used <= dataCodewords(ver, ecl) * 8) break;
    }
    const cap = dataCodewords(ver, ecl) * 8;
    const bits = [];
    const push = (val, len) => { for (let i = len - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    push(0x4, 4);
    push(bytes.length, ver <= 9 ? 8 : 16);
    bytes.forEach(b => push(b, 8));
    push(0, Math.min(4, cap - bits.length));
    push(0, (8 - (bits.length % 8)) % 8);
    for (let pad = 0xec; bits.length < cap; pad ^= 0xec ^ 0x11) push(pad, 8);
    const data = [];
    for (let i = 0; i < bits.length; i += 8) {
      let v = 0;
      for (let j = 0; j < 8; j++) v = (v << 1) | bits[i + j];
      data.push(v);
    }
    const all = addEccAndInterleave(data, ver, ecl);

    const n = ver * 4 + 17;
    const mod = Array.from({ length: n }, () => new Array(n).fill(false));
    const fn = Array.from({ length: n }, () => new Array(n).fill(false));
    const setFn = (x, y, dark) => { mod[y][x] = dark; fn[y][x] = true; };

    for (let i = 0; i < n; i++) { setFn(6, i, i % 2 === 0); setFn(i, 6, i % 2 === 0); }
    const finder = (cx, cy) => {
      for (let dy = -4; dy <= 4; dy++)
        for (let dx = -4; dx <= 4; dx++) {
          const d = Math.max(Math.abs(dx), Math.abs(dy));
          const x = cx + dx, y = cy + dy;
          if (x >= 0 && x < n && y >= 0 && y < n) setFn(x, y, d !== 2 && d !== 4);
        }
    };
    finder(3, 3); finder(n - 4, 3); finder(3, n - 4);
    const ap = alignPositions(ver);
    ap.forEach((ax, i) => ap.forEach((ay, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === ap.length - 1) || (i === ap.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++)
        for (let dx = -2; dx <= 2; dx++) setFn(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));

    const drawFormat = mask => {
      const d = (FORMAT_BITS[ecl] << 3) | mask;
      let rem = d;
      for (let i = 0; i < 10; i++) rem = (rem << 1) ^ ((rem >>> 9) * 0x537);
      const bs = ((d << 10) | rem) ^ 0x5412;
      for (let i = 0; i <= 5; i++) setFn(8, i, bit(bs, i));
      setFn(8, 7, bit(bs, 6)); setFn(8, 8, bit(bs, 7)); setFn(7, 8, bit(bs, 8));
      for (let i = 9; i < 15; i++) setFn(14 - i, 8, bit(bs, i));
      for (let i = 0; i < 8; i++) setFn(n - 1 - i, 8, bit(bs, i));
      for (let i = 8; i < 15; i++) setFn(8, n - 15 + i, bit(bs, i));
      setFn(8, n - 8, true);
    };
    drawFormat(0);
    if (ver >= 7) {
      let rem = ver;
      for (let i = 0; i < 12; i++) rem = (rem << 1) ^ ((rem >>> 11) * 0x1f25);
      const bs = (ver << 12) | rem;
      for (let i = 0; i < 18; i++) {
        const c = bit(bs, i), a = n - 11 + (i % 3), b = Math.floor(i / 3);
        setFn(a, b, c); setFn(b, a, c);
      }
    }

    let k = 0;
    for (let right = n - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let vert = 0; vert < n; vert++)
        for (let j = 0; j < 2; j++) {
          const x = right - j;
          const up = ((right + 1) & 2) === 0;
          const y = up ? n - 1 - vert : vert;
          if (!fn[y][x] && k < all.length * 8) {
            mod[y][x] = bit(all[k >>> 3], 7 - (k & 7));
            k++;
          }
        }
    }

    const applyMask = mask => {
      for (let y = 0; y < n; y++)
        for (let x = 0; x < n; x++) {
          let inv;
          switch (mask) {
            case 0: inv = (x + y) % 2 === 0; break;
            case 1: inv = y % 2 === 0; break;
            case 2: inv = x % 3 === 0; break;
            case 3: inv = (x + y) % 3 === 0; break;
            case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
            case 5: inv = ((x * y) % 2) + ((x * y) % 3) === 0; break;
            case 6: inv = (((x * y) % 2) + ((x * y) % 3)) % 2 === 0; break;
            default: inv = (((x + y) % 2) + ((x * y) % 3)) % 2 === 0;
          }
          if (!fn[y][x] && inv) mod[y][x] = !mod[y][x];
        }
    };
    let best = 0, bestP = Infinity;
    for (let mask = 0; mask < 8; mask++) {
      applyMask(mask);
      drawFormat(mask);
      const p = penalty(mod, n);
      if (p < bestP) { bestP = p; best = mask; }
      applyMask(mask); // undo
    }
    applyMask(best);
    drawFormat(best);
    return { size: n, modules: mod, version: ver };
  }

  /** Returns an <svg> string, quiet zone included. */
  function svg(text, { dark = '#14173d', light = '#ffffff', quiet = 4, ecl = 'M' } = {}) {
    const q = encode(text, ecl);
    const dim = q.size + quiet * 2;
    let d = '';
    for (let y = 0; y < q.size; y++)
      for (let x = 0; x < q.size; x++)
        if (q.modules[y][x]) d += `M${x + quiet},${y + quiet}h1v1h-1z`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${dim} ${dim}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="${dim}" height="${dim}" fill="${light}"/><path d="${d}" fill="${dark}"/></svg>`;
  }
  return { encode, svg };
})();

const $=s=>document.querySelector(s);
const ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';

const PHONE='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>';

const KEYSNIP='<script>addEventListener("keydown",function(e){var t=e.target||{};if((e.key==="h"||e.key==="H")&&!/INPUT|TEXTAREA/.test(t.tagName||"")&&!t.isContentEditable){try{parent.postMessage({mat:"home"},"*")}catch(x){}}});<\/script>';
let openId=null;
function logoHTML(p){
  if(p.logo==='collibry') return '<svg viewBox="0 0 106.25 121" aria-hidden="true"><use href="#cb-mark" width="106.25" height="121"/></svg>';
  return '<img alt="" src="'+(LOGOS[p.logo]||'')+'">';
}
const isLive=p=>!!(p.doc&&window.DOCS&&DOCS[p.doc]);
const CALM=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let picking=false;
function render(){
  const box=$('#cards');
  box.innerHTML=PRODUCTS.map((p,i)=>{const live=isLive(p);
    return '<button class="card '+(live?'live':'soon')+(p.named?' named':'')+'" data-id="'+p.id+'" data-name="'+p.name+'" style="--ac:'+p.accent+';--h:'+(p.h||'100%')+';--w:'+(p.w||'58%')+';--i:'+i+'" aria-label="'+p.name+(live?' — interactive demo, open':' — coming soon')+'"><span class="lg">'+logoHTML(p)+'</span><span class="nm">'+p.name+'</span><span class="st">'+(live?'<i class="dot"></i>Interactive demo':'Coming soon')+'</span></button>';}).join('');
  box.querySelectorAll('.card').forEach(c=>{
    c.addEventListener('click',e=>choose(c,e));
    if(!CALM){
      c.addEventListener('pointermove',e=>{ if(e.pointerType==='touch'||picking)return; const r=c.getBoundingClientRect(), x=(e.clientX-r.left)/r.width, y=(e.clientY-r.top)/r.height;
        c.style.setProperty('--mx',(x*100).toFixed(1)+'%'); c.style.setProperty('--my',(y*100).toFixed(1)+'%'); c.style.setProperty('--rx',((.5-y)*7).toFixed(2)+'deg'); c.style.setProperty('--ry',((x-.5)*9).toFixed(2)+'deg'); });
      c.addEventListener('pointerleave',()=>{ c.style.removeProperty('--rx'); c.style.removeProperty('--ry'); });
    }
  });
}
function ripple(c,e){ if(CALM)return; const r=c.getBoundingClientRect(), s=document.createElement('span'); s.className='rp';
  const x=e&&e.clientX?e.clientX-r.left:r.width/2, y=e&&e.clientY?e.clientY-r.top:r.height/2; s.style.left=x+'px'; s.style.top=y+'px'; c.appendChild(s); setTimeout(()=>s.remove(),750); }
function choose(c,e){
  const p=PRODUCTS.find(x=>x.id===c.dataset.id); if(!p||picking||openId)return;
  if(!isLive(p)){ c.classList.remove('nope'); void c.offsetWidth; c.classList.add('nope'); setTimeout(()=>c.classList.remove('nope'),550); ripple(c,e); toast(p.name+' is coming soon'); return; }
  picking=true; const box=$('#cards'), r=c.getBoundingClientRect(), v=$('#viewer');
  v.style.setProperty('--ox',Math.round(r.left+r.width/2)+'px'); v.style.setProperty('--oy',Math.round(r.top+r.height/2)+'px');
  box.classList.add('picking'); c.classList.add('picked'); ripple(c,e);
  setTimeout(()=>openProduct(p),CALM?0:360);
}
function resetPick(){ picking=false; const box=$('#cards'); box.classList.remove('picking'); box.querySelectorAll('.card.picked').forEach(c=>c.classList.remove('picked')); }
function renderFoot(){
  $('#qr').innerHTML='<span class="qrbox">'+QR.svg(SITE,{dark:'#0b1f44'})+'</span><span class="qrcap"><b>Scan to visit our website</b><span>'+SITE.replace(/^https?:\/\/(www\.)?/,'')+'</span></span>';

}
let tt; function toast(t){const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(tt); tt=setTimeout(()=>e.classList.remove('show'),2000);}
const DOCCACHE={};
function fetchText(u){return fetch(u).then(r=>{if(!r.ok)throw new Error(u+' '+r.status);return r.text()})}
function loadScript(u){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=()=>rej(new Error(u));document.head.appendChild(s)})}
let clipsP=null; function loadClips(){ if(!clipsP) clipsP=Promise.all(['assets/clips/clips.js','assets/clips/webp.js'].map(loadScript)); return clipsP; }
function getDoc(p){ return DOCCACHE[p.id]||(DOCCACHE[p.id]=fetchText(DOCS[p.doc]).catch(e=>{delete DOCCACHE[p.id];throw e})); }
async function openProduct(p){
  if(openId)return; openId=p.id;
  const mine=p.id;
  let doc, extra=KEYSNIP;
  try{
    doc=await getDoc(p);
    if(p.id==='collibry'){ try{ await loadClips(); let pre=''; if(window.HUBCLIPS)pre+='<script>window.PD_CLIPS='+JSON.stringify(window.HUBCLIPS)+';<\/script>'; if(window.HUBWEBP)pre+='<script>window.PD_WEBP='+JSON.stringify(window.HUBWEBP)+';<\/script>'; extra=pre+extra; }catch(e){} }
  }catch(e){ openId=null; toast('Could not load '+p.name+'. Open this site from a web server (GitHub Pages), not from a local file.'); return; }
  if(openId!==mine)return;
  const v=$('#viewer'), f=document.createElement('iframe'); f.id='pf'; f.title=p.name+' demo';
  f.addEventListener('load',()=>{ try{f.contentWindow.focus()}catch(e){} });
  doc=doc.includes('</body>')?doc.replace('</body>',extra+'</body>'):doc+extra;
  f.srcdoc=doc; v.appendChild(f); v.classList.add('open'); $('#home').classList.add('show');
}
function goHome(){
  if(!openId)return; openId=null; const v=$('#viewer'); v.classList.remove('open'); $('#home').classList.remove('show'); resetPick();
  setTimeout(()=>{ if(!openId){const f=$('#pf'); if(f)f.remove();} },520);
}
window.addEventListener('message',e=>{ const d=e.data||{}; if(d.mat==='home')goHome(); else if(d.mat==='exp'&&openId){ $('#home').classList.toggle('show',!d.on); } });
window.addEventListener('DOMContentLoaded',()=>{
  $('#home').innerHTML=HOME; $('#home').addEventListener('click',goHome); render(); renderFoot();
  window.__ready=1; (function(){const idle=window.requestIdleCallback||(f=>setTimeout(f,1200)); idle(async()=>{ for(const p of PRODUCTS){ if(p.doc&&DOCS[p.doc]){ try{await getDoc(p)}catch(e){} } } try{loadClips()}catch(e){} },{timeout:4000}); if('serviceWorker' in navigator&&/^https?:/.test(location.protocol)){ navigator.serviceWorker.register('sw.js').catch(()=>{}) } })(); const bt=document.getElementById('boot'); if(bt)bt.remove();
  document.addEventListener('keydown',e=>{ if(e.target&&/INPUT|TEXTAREA/.test(e.target.tagName))return; if(e.key==='h'||e.key==='H')goHome(); else if(!openId&&/^[1-9]$/.test(e.key)){const p=PRODUCTS[+e.key-1]; if(p){const c=document.querySelector('[data-id="'+p.id+'"]'); c&&c.click();}} });
});
